[project]
name = "boutique-api"
version = "0.1.0"
description = "API backend para el sitio de la boutique"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic",
    "pydantic[email]",
    "sqlalchemy>=2.0,<2.1",
    "pymysql==1.2.0",
    "bcrypt==5.0.0",
    "python-jose[cryptography]==3.5.0",
    "python-multipart",
    "slowapi==0.1.9",
]

[tool.uv]
package = false